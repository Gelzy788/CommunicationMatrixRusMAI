name: dev-server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')

          echo "backend=ghcr.io/${OWNER}/${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "nginx=ghcr.io/${OWNER}/${REPO}-nginx" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./deploy/nginx/Dockerfile
          build-contexts: |
            nginx-config=./deploy/nginx
          push: true
          tags: |
            ${{ steps.images.outputs.nginx }}:${{ github.sha }}
            ${{ steps.images.outputs.nginx }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          NGINX_IMAGE: ${{ steps.images.outputs.nginx }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_TAG,BACKEND_IMAGE,NGINX_IMAGE
          script: |
            cd /opt/communication-matrix

            export BACKEND_IMAGE
            export NGINX_IMAGE

            chmod +x deploy/deploy.sh

            ./deploy/deploy.sh "$IMAGE_TAG"
