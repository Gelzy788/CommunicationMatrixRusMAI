services:
  db:
    image: postgres:16-alpine
    container_name: matrix_users_postgres
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matrix_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: communication-matrix-backend:dev
    container_name: matrix_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      POSTGRES_IP: db
      POSTGRES_PORT: 5432
      COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    # Только localhost, для отладки на самом сервере. Снаружи бэк
    # доступен только через nginx (/api/...).
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    build:
      context: ./frontend
      dockerfile: ../deploy/nginx/Dockerfile
      additional_contexts:
        nginx-config: ./deploy/nginx
    image: communication-matrix-nginx:dev
    container_name: matrix_nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8081}:80"

volumes:
  matrix_users_data:
